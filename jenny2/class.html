<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>register</title>
    <link rel="stylesheet" href="class.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">the Margin</div>
        <nav class="log">
            <a href="#posts">Posts</a>
            <a href="#signin">Sign in</a>
            <button href="#getstarted" >Get started</button>
        </nav>
    </header>
    
    <section class="inform-text">
        <form autocomplete="off">
            <h1 class="start">Start Writing.</h1>
            <p class="create">Create an account and publish your first essay.</p>

            <label for="name" class="your-name">Your name</label>
            <input type="text" id="name" placeholder="jennifer" autocomplete="off">

            <label for="email" class="email">Email</label>
            <input type="email" id="email" placeholder="jenniferdalyop57@gmail.com" autocomplete="new-password">

            <label for="password" class="password">Password</label>
            <input type="password" id="password" placeholder="12345678" autocomplete="new-password">

            <button type="submit">create account</button>

            <p class="type">Already have an account? <a class="sign-in" href="#">sign-in</a></p>
        </form>
    </section>

    <footer class="footer">
        <div class="footer-log">the margin</div>
        <div class="footer-text">
            a place for ideas worth keeping.
        </div>
    </footer>
</body>
</html>
