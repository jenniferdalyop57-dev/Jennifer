<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="jeni.css">
</head>
<body>
    <header class="header">
        <div class="top">
            The margin
        </div>
        <div class="post">
            <a href="#posts">posts</a>
            <button>write</button>
            <div>
                <img src="/images/Layout.png" alt="">
            </div>
        </div>
    </header>
    <section class="heading">
        <div class="top-page">
            <h1>write a new post</h1>
            <p>share an idea,an essay, a rflection</p>
            <p>Title</p>
            <input type="title" placeholder="something worth reading">
            <label>Excerpt (optional- generated from content if blank)</label>
            <input type="text" placeholder="A sentence or two that draw the reader in.">
            <div>
                <div class="culture">
                    <label category></label>
                    <input type="text" placeholder="culture">
                </div>
                <div class="min">
                    <label> read time (minutes)</label>
                    <input type="text" placeholder="read time (minutes)" >
                </div>
            </div> 
            <div class="text">
                <p>content</p>
                <textarea placeholder="start writing separate paragraph with a blank line. wrap *word* in asterisks for italaics." rows=20></textarea>
            </div>
        </div>
    </section>
    <footer class="sign">
        <div>The margin</div>
        <div>a place for ideas worth keeping</div>
        <div>sign out</div>
    </footer>
</body> 
</html>
